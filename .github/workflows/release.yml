# Builds the Mac app on every change to main and publishes it as a GitHub Release.
# Installed copies of CheckMate Browser check the latest release and update themselves.
# A new release is made only when the version in package.json goes up.
name: Build and release Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.v.outputs.version }} is already released; bump the version in package.json to publish a new one."
          fi

      - name: Install
        if: steps.chk.outputs.skip != '1'
        run: npm ci --no-fund --no-audit

      # With an Apple Developer ID (repository secrets below) the app is signed and notarized,
      # so Macs open it without the "Apple could not verify" warning. Without them it is ad-hoc signed.
      #   MAC_CERT_P12_BASE64  Developer ID Application certificate (.p12), base64
      #   MAC_CERT_PASSWORD    password of that .p12
      #   APPLE_ID             Apple ID e-mail of the developer account
      #   APPLE_APP_PASSWORD   app-specific password (appleid.apple.com → Sign-In and Security)
      #   APPLE_TEAM_ID        10-character Team ID (developer.apple.com → Membership)
      - name: Build the app (Apple chip and Intel)
        if: steps.chk.outputs.skip != '1'
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "Signing with Developer ID and notarizing"
            npx electron-builder --mac dir --universal --publish never \
              -c.mac.hardenedRuntime=true -c.mac.gatekeeperAssess=false \
              -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist \
              -c.mac.notarize=true
          else
            echo "No Developer ID secrets: ad-hoc signing (Macs will warn on first open)"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --universal -c.mac.identity=null --publish never
          fi

      - name: Package zip and dmg
        if: steps.chk.outputs.skip != '1'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          BUILT=$(ls -d dist/mac*/*.app | head -1)
          mkdir -p out stage
          cp -R "$BUILT" "stage/CheckMate Browser.app"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "stage/CheckMate Browser.app/Contents/Info.plist")
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "stage/CheckMate Browser.app/Contents/Info.plist")
          echo "CFBundleName=$NAME EXE=$EXE"
          # The menu bar shows CFBundleName, so it must say CheckMate Browser.
          test "$NAME" = "CheckMate Browser" || { echo "ERROR: CFBundleName is '$NAME'"; exit 1; }
          # Electron looks for "<CFBundleName> Helper.app"; if the names differ the app crashes at launch.
          test -d "stage/CheckMate Browser.app/Contents/Frameworks/$NAME Helper.app" || { echo "ERROR: helper app for '$NAME' not found"; ls "stage/CheckMate Browser.app/Contents/Frameworks"; exit 1; }
          # (Read the output into a variable first: "codesign | grep -q" can fail under pipefail and made us
          # replace the real Developer ID signature with an ad-hoc one, which reset Full Disk Access.)
          SIGINFO=$(codesign -dv "stage/CheckMate Browser.app" 2>&1 || true)
          echo "$SIGINFO" | grep -E "Authority|TeamIdentifier|Signature" || true
          if [[ "$SIGINFO" == *"Authority=Developer ID"* ]]; then
            codesign --verify --deep --strict --verbose=2 "stage/CheckMate Browser.app"
            spctl -a -vv -t exec "stage/CheckMate Browser.app" || true
          else
            if [ -n "$APPLE_TEAM_ID" ]; then echo "ERROR: Developer ID secrets exist but the app is not Developer ID signed"; exit 1; fi
            codesign --force --deep --sign - "stage/CheckMate Browser.app"
          fi
          # Smoke test: really start the packaged app. A launch crash (like "Unable to find helper app") gives a non-zero exit and stops the release.
          echo "Smoke test: launching the packaged app"
          rm -rf "$RUNNER_TEMP/smoke"
          MULTISPACE_SMOKE=1 perl -e 'alarm 120; exec @ARGV' "stage/CheckMate Browser.app/Contents/MacOS/$EXE" "--user-data-dir=$RUNNER_TEMP/smoke" || { echo "ERROR: the packaged app crashed or did not start"; exit 1; }
          echo "Smoke test passed"
          (cd stage && ditto -c -k --keepParent "CheckMate Browser.app" ../out/CheckMate-Browser-mac.zip)
          ln -s /Applications stage/Applications
          hdiutil create -volname "CheckMate Browser" -srcfolder stage -ov -format UDZO out/CheckMate-Browser.dmg
          ls -lh out

      - name: Publish release
        if: steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" out/CheckMate-Browser-mac.zip out/CheckMate-Browser.dmg \
            --title "CheckMate Browser $V" \
            --notes "Install: download CheckMate-Browser.dmg, open it and drag CheckMate Browser into Applications. Installed copies update themselves."
