<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:" />
<title>CheckMate</title>
<link rel="stylesheet" href="popout.css" />
</head>
<body>
  <div id="bar">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">⟳</button>
    <form id="form"><input id="address" spellcheck="false" /></form>
    <button id="zoom" title="Page zoom. Click to reset to 100%">100%</button>
    <button id="home" title="Put this tab back in the main window">⇱ Back to main window</button>
  </div>
  <script src="popout.js"></script>
</body>
</html>
