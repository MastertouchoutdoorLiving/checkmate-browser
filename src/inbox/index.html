<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:" />
<title>Unread</title>
<link rel="stylesheet" href="inbox.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Unread <span id="total"></span></h1>
      <div id="filters">
        <button data-f="all" class="on">All</button>
        <button data-f="imsg">iMessage</button>
        <button data-f="wa">WhatsApp</button>
        <button data-f="app">Other apps</button>
      </div>
    </header>
    <div id="notes"></div>
    <div id="list"></div>
  </div>
  <div id="reply" hidden>
    <div id="r-hist"></div>
    <textarea id="r-text" rows="2" placeholder="Write a reply…  (Enter sends, Shift+Enter new line)"></textarea>
    <div class="r-bar">
      <select id="r-quick"><option value="">⚡ Quick reply…</option></select>
      <button type="button" class="r-btn" id="r-ai" hidden>✨ Suggest</button>
      <span class="msg" id="r-msg"></span>
      <button type="button" class="r-btn link" id="r-read">Mark read</button>
      <button type="button" class="r-btn link" id="r-open">Open chat ↗</button>
      <button type="button" class="r-btn link" id="r-close">Close</button>
      <button type="button" class="r-btn primary" id="r-send">Send · <span id="r-via">iMessage</span></button>
    </div>
  </div>
  <script src="inbox.js"></script>
</body>
</html>
